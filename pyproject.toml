[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-companion"
version = "0.1.0"
description = "Simulation and control experiments for a companion robot."
readme = "README.md"
requires-python = ">=3.10.11"
dependencies = [
    "mujoco>=3.11,<4",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"